name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Меняем на 3.10 для стабильности
      
      - name: Install dependencies directly
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install spire.doc.free  # Устанавливаем напрямую
      
      - name: Build app
        run: |
          pyinstaller --onefile --windowed --name="ODT_to_DOCX_Converter" converter_app.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/ODT_to_DOCX_Converter
